<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your shortlist | GetYourCollege</title>
<meta name="description" content="Your saved colleges and a side-by-side comparison.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;display=swap"><link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
<section><div class="wrap">
  <p class="eyebrow">Shortlist</p>
  <h1>Your shortlist</h1>
  <p class="muted" id="saved-count" aria-live="polite"></p>
  <div class="empty" id="empty" hidden><h2>Nothing saved yet</h2><p class="muted">Add colleges to your shortlist and they will show up here. Your list stays in this browser only.</p><a class="btn" href="/colleges/">Explore colleges</a></div>
  <div class="grid" id="saved"></div>
</div></section>
<section><div class="wrap">
  <h2>Compare</h2>
  <p class="muted" id="compare-hint"></p>
  <div id="compare-wrap" hidden><div class="table-wrap" id="compare" tabindex="0" role="region" aria-label="Comparison table, scrolls horizontally"></div></div>
</div></section>
<section id="exam-sec" hidden><div class="wrap">
  <p class="eyebrow">Exams and tools</p><h2>Prepare for entrance exams</h2>
  <div class="grid" id="exam-grid"></div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/shortlist.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/lead.js"></script>
<script src="/assets/js/details.js"></script>
<script src="/assets/js/marquee.js"></script>
<script src="/assets/js/shortlist-page.js"></script>
</body>
</html>
