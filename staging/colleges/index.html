<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Colleges | GetYourCollege</title>
<meta name="description" content="Search and filter colleges, shortlist and compare.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&amp;display=swap"><link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
<section class="page-hero"><div class="wrap">
  <p class="eyebrow">Colleges</p><h1>Explore colleges</h1><p class="muted" data-count></p>
</div></section>
<section><div class="wrap split">
  <div class="main-col">
    <form class="filters" id="filters" role="search">
      <div><label for="q">Search</label><input type="search" id="q" placeholder="College or city" autocomplete="off"></div>
      <div><label for="cat">Category</label><select id="cat"></select></div>
      <div><label for="state">Location (state)</label><select id="state"></select></div>
      <div><label for="city">City</label><select id="city"></select></div>
      <div><label for="fee">Fees (total course fee)</label><select id="fee"></select></div>
      <div><label for="sort">Sort by</label><select id="sort"><option value="">Name (A-Z)</option><option value="fee">Fees: low to high</option><option value="closing">Closing soonest</option></select></div>
    </form>
    <p class="results-line" id="result-status" aria-live="polite">Loading colleges...</p>
    <div class="grid" id="grid"></div>
    <div class="more-wrap"><button type="button" class="btn ghost" id="more" hidden>Load more</button></div>
  </div>
  <aside class="side-form" id="contact" aria-labelledby="form-title">
    <div class="contact-box">
      <p class="eyebrow">Free &middot; no account needed</p>
      <h2 id="form-title">Register now</h2>
      <div id="contact-form"><p class="muted">Loading form...</p></div>
    </div>
  </aside>
</div></section>
<section id="exams" hidden><div class="wrap">
  <div class="section-head"><p class="eyebrow">Exams and tools</p><h2>Exams and tools</h2></div>
  <div class="grid" id="exam-grid"></div>
</div></section>

</main>
<div class="compare-bar" id="compare-bar" hidden><span id="compare-n" aria-live="polite"></span><a class="btn small" id="compare-go" href="#">Compare</a></div>
<div id="site-footer"></div>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/shortlist.js"></script>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/lead.js"></script>
<script src="/assets/js/details.js"></script>
<script src="/assets/js/marquee.js"></script>
<script src="/assets/js/colleges.js"></script>
</body>
</html>
